# Конфіг mpv саме для Jellium Desktop.
#
# Важливий момент: Jellium НЕ читає ~/.config/mpv/.
# Свій MPV_HOME він виставляє сюди — ~/.config/jellium-desktop/mpv/
# Тож цей файл має лежати саме тут, інакше його ніхто не побачить.

# Сокет, через який можна смикати mpv ззовні.
# Всередині Jellium клавіатура до mpv не доходить (її з'їдає CEF),
# тому звичний бінд в input.conf тут не працює.
# Натомість тогл шейдера робить скрипт toggle-crt.sh через цей сокет.
input-ipc-server=/tmp/jellium-mpv.sock

# CRT-фільтр за дефолтом ВИМКНЕНИЙ — вмикається скриптом, коли захочеш.
# Хочеш, щоб вмикався сам при кожному запуску? Розкоментуй рядок нижче.
# Шлях тільки абсолютний: тильду (~) mpv тут не розгортає.
#glsl-shaders=__HOME__/.config/jellium-desktop/mpv/shaders/crt-lottes.glsl
